
version: '3.8'
services:
  backend:
    build: ./backend
    container_name: photoshare-backend
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
  frontend:
    build: ./frontend
    container_name: photoshare-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
volumes:
  uploads_data: